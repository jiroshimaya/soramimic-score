[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soramimic-score"
version = "0.2.0"
description = "Evidence-preserving singing transcription and score contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jasyllablesep==0.0.0",
]

[project.scripts]
soramimic-score = "soramimic_score.__main__:main"

[tool.setuptools]
packages = ["soramimic_score"]

[tool.pytest.ini_options]
testpaths = ["tests"]
