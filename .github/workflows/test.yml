name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra web --extra test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q soramimic_score scripts
      - run: uv run python scripts/check_repository_boundary.py
